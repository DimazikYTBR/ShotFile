name: Build ShotFile
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
env:
  PYTHONUTF8: "1"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python prebuild.py
      - run: python shotfile.py --make-icon
      - run: pyinstaller --noconfirm --onedir --windowed --noupx --hidden-import pystray._win32 --name ShotFile --icon icon.ico --version-file version.txt shotfile.py
      - run: Compress-Archive -Path dist\ShotFile -DestinationPath ShotFile-win64.zip
      - run: echo "SHA256=$((Get-FileHash ShotFile-win64.zip -Algorithm SHA256).Hash)" >> $env:GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: ShotFile ${{ env.APP_VERSION }}
          body: "SHA-256: ${{ env.SHA256 }}"
          files: ShotFile-win64.zip
