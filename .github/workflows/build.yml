name: Build ShotFile.exe
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
env:
  PYTHONUTF8: "1"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python shotfile.py --make-icon
      - run: pyinstaller --noconfirm --onefile --windowed --name ShotFile --icon icon.ico shotfile.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ShotFile
          files: dist/ShotFile.exe
