name: Build ShotFile.exe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python shotfile.py --make-icon
      - run: pyinstaller --noconfirm --onefile --windowed --name ShotFile --icon icon.ico shotfile.py
      - uses: actions/upload-artifact@v4
        with:
          name: ShotFile-exe
          path: dist/ShotFile.exe
